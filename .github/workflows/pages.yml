name: Publish Ingress redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the viewer redirect
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Open Ingress</title>
            <link rel="canonical" href="https://ingress-ro5t.onrender.com/">
          </head>
          <body>
            <a id="viewer" href="https://ingress-ro5t.onrender.com/">Open Ingress</a>
            <script>
              const link = document.getElementById('viewer');
              const viewer = new URL(link.href);
              const shared = new URLSearchParams(window.location.search);
              for (const key of ['ra', 'dec', 'band', 'date', 'fov', 'from', 'to']) {
                const value = shared.get(key);
                if (value) viewer.searchParams.set(key, value);
              }
              link.href = viewer.href;
              window.location.replace(viewer.href);
            </script>
          </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
